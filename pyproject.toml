[project]
name = "culprit"
version = "0.0.1"
description = "When payment approval rates drop, can an agent find which segment is to blame? An honest evaluation on simulated data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "cleanroom",
    "numpy>=2.1",
    "polars>=1.30",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
]

[project.optional-dependencies]
# Time series foundation model (Chronos-Bolt-tiny). Optional so CI and the
# classical detectors stay light; install with `uv sync --extra tsfm`.
# CPU-only torch wheels (methodology M5). Tests never download weights.
tsfm = [
    "torch>=2.6",
    "chronos-forecasting>=2.3",
]
# The LLM investigator (Claude API). Optional: tests replay cassettes and need
# no key; live runs need ANTHROPIC_API_KEY in the environment, never in git.
agent = [
    "anthropic>=1.0",
]

[project.scripts]
culprit = "culprit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/culprit"]

[tool.uv.sources]
# The shared Cleanroom, installed from a git tag, never copied (CLAUDE.md, Tells D1).
# v0.2 adds events (alarm matching, thresholds for a fixed alarm rate), vault
# (sealed answer key), guard (sealed runs) and forecast scoring (methodology M4).
cleanroom = { git = "https://github.com/BK5102/tells", tag = "cleanroom-v0.2", subdirectory = "packages/cleanroom" }
torch = [{ index = "pytorch-cpu" }]

# CPU-only PyTorch wheels: smaller, and this project never uses a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # one-off CLI scripts with long usage lines
